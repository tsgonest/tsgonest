name: CI

on:
  push:
    branches: [main]
    # Tag pushes must trigger CI too — the release workflow waits for this
    # run on the tagged commit to succeed before publishing.
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Full test suite (unit + e2e) ──────────────────────────────
  #
  # The Windows leg currently exposes a backlog of platform-specific bugs
  # tracked in issues #136, #137, #138, #143–#150. Until those land, expect
  # this matrix slot to fail — that is by design: a red Windows job blocks
  # PRs until the platform-handling fixes ship.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # bash is available on all GitHub-hosted runners (Git Bash on Windows).
        # Using a single shell keeps `just` recipes and inline scripts portable.
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: '**/go.sum'

      - uses: extractions/setup-just@v3

      - uses: pnpm/action-setup@v5
        with:
          version: '10'

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Initialize project
        run: just init

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # ── Go unit tests ────────────────────────────────────────
      - name: Run Go unit tests
        run: just test-unit

      # ── Build binary + packages (needed by e2e) ────────────────
      - name: Build binary
        run: just build

      - name: Build TypeScript packages
        run: pnpm build:packages

      - name: Build migrate script
        run: pnpm --filter tsgonest build:migrate

      # ── E2e tests ────────────────────────────────────────────
      - name: Run e2e tests
        run: just test-e2e
