name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Cross-platform runner process management tests ────────────
  runner-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: '**/go.sum'

      - uses: extractions/setup-just@v2

      - name: Initialize project
        run: just init

      - name: Run runner process management tests
        env:
          RUNNER_BUG_TESTS: '1'
        run: go test -v ./internal/runner/ -timeout 120s

  # ── Full test suite (unit + e2e) ──────────────────────────────
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: '**/go.sum'

      - uses: extractions/setup-just@v2

      - uses: pnpm/action-setup@v4
        with:
          version: '10'

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Initialize project
        run: just init

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # ── Go unit tests ────────────────────────────────────────
      - name: Run Go unit tests
        run: just test-unit

      # ── Build binary + packages (needed by e2e) ────────────────
      - name: Build binary
        run: just build

      - name: Build TypeScript packages
        run: pnpm build:packages

      - name: Build migrate script
        run: pnpm --filter tsgonest build:migrate

      # ── E2e tests ────────────────────────────────────────────
      - name: Run e2e tests
        run: just test-e2e
