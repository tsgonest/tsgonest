name: Benchmark

on:
  pull_request:
    branches: [main]
    # Only run benchmarks when Go source or benchmark code changes
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'shim/**'
      - 'benchmarks/**'
      - 'go.mod'
      - 'go.sum'

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: '**/go.sum'

      - uses: extractions/setup-just@v3

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Init submodule
        run: just init

      - name: Install benchmark deps
        run: cd benchmarks && pnpm install --frozen-lockfile

      # ── PR benchmarks only (skip base comparison to halve CI time) ──
      - name: Build binary
        run: just build

      - name: Build companions
        run: cd benchmarks && pnpm run build

      - name: Run benchmarks
        run: cd benchmarks && npx tsx --tsconfig bench/tsconfig.json bench/bench-all.ts --json > /tmp/pr-bench.json

      - name: Generate report
        run: |
          echo "## Benchmark Results" > /tmp/bench-comment.md
          echo "" >> /tmp/bench-comment.md
          echo '```json' >> /tmp/bench-comment.md
          cat /tmp/pr-bench.json >> /tmp/bench-comment.md
          echo '```' >> /tmp/bench-comment.md

      - name: Post benchmark comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: benchmark
          path: /tmp/bench-comment.md
