version: 2
updates:
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "submodule"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
    exclude-paths:
      - "apps/docs/**"
      - "benchmarks/**"
      - "testdata/**"
    ignore:
      - dependency-name: "@tsgonest/cli-*"
      # TS 7 drops the classic compiler API that tsdown's dts build and ts-morph rely on.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
